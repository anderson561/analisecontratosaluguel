name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      # Testes "integration" exigem recursos externos (Tesseract real, LLM,
      # contratos reais fora do repo — LGPD) e ficam de fora do CI.
      - name: Testes
        run: pytest -q -m "not integration"
