[project]
name = "contract-parser"
version = "0.1.0"
description = "Leitor Inteligente de Contratos de Locação (AI Contract Parser)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "customtkinter>=5.2",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
contract-parser-envcheck = "contract_parser.infrastructure.environment_check:main"
contract-parser-gui = "contract_parser.presentation.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=contract_parser --cov-report=term-missing"
markers = [
    "integration: testes que exigem recursos reais externos ao codigo (ex.: pytesseract instalado, provedor de LLM configurado, lote de contratos reais via CONTRATOS_REAIS_DIR); skip automatico se indisponivel",
]

[tool.ruff]
line-length = 100
target-version = "py311"
